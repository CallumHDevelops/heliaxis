<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar" id="bar">
    <span class="brand"><span class="dot"></span>Metis</span>
    <span class="grow"></span>
    <button class="icon" id="btn-chats" title="Show chats" aria-label="Show chats">Chats</button>
    <button class="icon" id="btn-new" title="New chat (Ctrl+N)" aria-label="New chat">New chat</button>
    <button class="icon" id="btn-settings" title="Settings" aria-label="Settings">Settings</button>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div class="banner info" id="update-banner" hidden><span id="update-text"></span> <button class="primary small" id="update-btn" type="button" hidden>Restart to update</button></div>

  <!-- Sign in -->
  <main id="view-login" class="view" hidden>
    <form id="login-form" class="card">
      <h1>Sign in to Metis</h1>
      <p class="muted">Use your normal HAP email and password.</p>
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="primary" id="login-btn" type="submit">Sign in</button>
    </form>
  </main>

  <!-- Chat -->
  <div id="view-chat" class="view chatwrap" hidden>
    <aside id="side" class="side" hidden>
      <input id="thread-search" type="search" placeholder="Search chats" aria-label="Search chats">
      <div class="tabs" role="tablist">
        <button id="tab-active" class="tab on" type="button" role="tab" aria-selected="true">Chats</button>
        <button id="tab-archived" class="tab" type="button" role="tab" aria-selected="false">Archived</button>
      </div>
      <ul id="threads" class="threads"></ul>
    </aside>
    <section class="chat">
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="working" class="working" hidden><span class="spark"></span><span id="working-text">Working…</span></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Ask Metis…  (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
        <button class="primary" id="send" type="submit">Send</button>
      </form>
    </section>
  </div>

  <!-- Settings -->
  <main id="view-settings" class="view" hidden>
    <div class="card">
      <h1>Settings</h1>
      <label>Global shortcut
        <input id="set-hotkey" type="text" placeholder="Press the keys…" readonly>
      </label>
      <p class="muted small">Click the box, then press the combination you want (include Ctrl, Alt or Shift). Default Ctrl+Shift+H.</p>
      <p class="error" id="hotkey-error"></p>
      <label class="check"><input id="set-startup" type="checkbox"> Start Metis with Windows</label>
      <label>HAP address<input id="set-url" type="url"></label>
      <p class="muted small" id="set-who"></p>
      <div class="row">
        <button class="ghost" id="settings-back" type="button">Back</button>
        <button class="ghost" id="logout" type="button">Sign out</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
