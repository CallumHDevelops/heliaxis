:root{--ink:#211F18;--ink-2:#2c2820;--solar:#F8BC1E;--amber:#E39A0C;--amber-2:#C77F04;--paper:#F7F2E7;--paper-2:#EFE8D8;--card:#FFFDF8;--muted:#6E6A5E;--muted-d:#A69F8E;--ok:#3f7d4e;--line:rgba(33,31,24,.14);--line-d:rgba(247,242,231,.16);--display:'Ezra',system-ui,sans-serif;--body:'Hanken Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);background:#e7e1d2;color:var(--ink);height:100vh;overflow:hidden}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
/* app shell */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.toolbar{background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid #000}
.toolbar img{height:22px}
.toolbar .sp{flex:1}
.toolbar .mono{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-d)}
.pagesel{background:var(--ink-2);color:var(--paper);border:1px solid var(--line-d);border-radius:3px;padding:7px 10px;font-family:var(--body);font-size:.86rem}
.tbtn{background:none;border:1px solid var(--line-d);color:var(--paper);border-radius:3px;padding:7px 12px;font-size:.84rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.tbtn:hover{border-color:var(--solar)}
.tbtn.solar{background:var(--solar);color:var(--ink);border-color:var(--solar)}
.tbtn.solar:hover{background:var(--amber)}
.tbtn svg{width:14px;height:14px}
.main{display:grid;grid-template-columns:340px 1fr;overflow:hidden}
/* left panel */
.left{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--paper-2)}
.tab{flex:1;padding:10px 4px;font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--solar);background:var(--card)}
.panel{flex:1;overflow-y:auto;padding:16px}
.panel.hide{display:none}
.ph{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-2);margin:2px 0 12px;display:flex;align-items:center;gap:6px}
/* block outline */
.blkrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--paper);margin-bottom:7px;cursor:grab;font-size:.86rem}
.blkrow.sel{border-color:var(--solar);box-shadow:0 0 0 1px var(--solar)}
.blkrow.drag{opacity:.4}
.blkrow .gr{color:var(--muted-d);font-family:var(--mono);font-size:.8rem}
.blkrow .nm{flex:1;font-weight:600}
.blkrow .ty{font-family:var(--mono);font-size:.58rem;text-transform:uppercase;color:var(--muted)}
.blkrow .x{border:0;background:none;color:var(--muted);font-size:1rem;padding:0 4px;border-radius:2px}
.blkrow .x:hover{color:var(--amber-2)}
.addwrap{margin-top:12px}
.addbtn{width:100%;border:1px dashed var(--line);background:var(--paper-2);border-radius:3px;padding:11px;font-weight:600;font-size:.86rem;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.addbtn:hover{border-color:var(--solar);color:var(--amber-2)}
.addmenu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.addmenu.hide{display:none}
.addmenu button{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:9px 6px;font-size:.78rem;font-weight:600;text-align:left}
.addmenu button:hover{border-color:var(--solar);background:var(--paper)}
/* inspector fields */
.fld{margin-bottom:12px}
.fld label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;font-family:var(--body);font-size:.88rem;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--solar);box-shadow:0 0 0 2px rgba(248,188,30,.2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:8px 0}
.chk input{width:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;padding:7px;background:var(--card);border:0;border-right:1px solid var(--line);font-size:.8rem;font-weight:600}
.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:var(--paper)}
.sub{border:1px solid var(--line);border-radius:3px;padding:10px;margin-bottom:8px;background:var(--paper)}
.sub .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sub .sh b{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;color:var(--muted)}
.miniadd{border:1px dashed var(--line);background:none;border-radius:3px;padding:7px;width:100%;font-size:.8rem;font-weight:600;color:var(--amber-2)}
.rm{border:0;background:none;color:var(--amber-2);font-size:.72rem;font-weight:700}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.iconpick button{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;background:var(--paper-2);display:grid;place-items:center;padding:4px}
.iconpick button.on{border-color:var(--solar);background:var(--solar)}
.iconpick svg{width:18px;height:18px}
.hint{font-size:.76rem;color:var(--muted);line-height:1.5;background:var(--paper-2);border-radius:3px;padding:10px;margin-bottom:10px}
.hint b{color:var(--ink)}
/* logos */
.logolist{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.logoitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:var(--paper)}
.logoitem .lg{width:40px;height:26px;display:grid;place-items:center;background:var(--paper-2);border-radius:2px;font-family:var(--display);font-weight:800;font-size:.6rem;color:var(--muted);overflow:hidden}
.logoitem .lg img{max-width:100%;max-height:100%}
.logoitem .nm{flex:1;font-size:.84rem;font-weight:600}
.logoitem .bnr{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.56rem;text-transform:uppercase;color:var(--muted)}
/* landing templates */
.tplgrid{display:grid;gap:7px}
.tpl{border:1px solid var(--line);border-radius:3px;padding:11px 12px;background:var(--paper);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tpl:hover{border-color:var(--solar);background:var(--card)}
.tpl b{font-size:.88rem}.tpl .d{font-size:.72rem;color:var(--muted);margin-top:1px}
.tpl .go{font-family:var(--mono);font-size:.6rem;color:var(--amber-2);white-space:nowrap}
/* preview */
.right{overflow:hidden;position:relative;background:#d9d2c1}
.pvbar{position:absolute;top:0;left:0;right:0;z-index:5;background:rgba(33,31,24,.9);color:var(--paper);font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;display:flex;justify-content:space-between;align-items:center}
.pvbar .vw{display:flex;gap:4px}
.pvbar .vw button{background:none;border:1px solid var(--line-d);color:var(--paper);border-radius:2px;padding:3px 8px;font-family:var(--mono);font-size:.6rem;text-transform:uppercase}
.pvbar .vw button.on{background:var(--solar);color:var(--ink);border-color:var(--solar)}
.pvscroll{position:absolute;inset:30px 0 0;overflow-y:auto;display:flex;justify-content:center;padding:20px}
.preview{width:100%;max-width:1160px;background:var(--paper);box-shadow:0 20px 50px -30px rgba(0,0,0,.5);align-self:flex-start;min-height:200px}
.preview.mob{max-width:390px}
.pv-block{position:relative;outline:0}
.pv-block:hover{outline:2px dashed rgba(248,188,30,.7);outline-offset:-2px}
.pv-block.sel{outline:2px solid var(--solar);outline-offset:-2px}
.pv-empty{padding:80px 20px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.8rem}
/* ---------- PREVIEW (brand) ---------- */
.preview h1,.preview h2,.preview h3,.preview h4{font-family:var(--display);letter-spacing:-.015em;line-height:1.05;margin:0}
.preview p{margin:0}
.pv-hero{background:var(--ink);color:var(--paper);position:relative;overflow:hidden;padding:60px 44px}
.pv-hero.light{background:var(--paper);color:var(--ink)}

.pv-btn.dark{background:var(--ink);color:var(--paper)}
.pv-btn.ghost{border:1.5px solid currentColor}
.pv-btn{overflow:hidden}
.pv-btn::after{content:"";position:absolute;top:0;left:-130%;width:55%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);pointer-events:none}

@keyframes pvshine{to{left:150%}}
.pv-btn.pulse{animation:pvpulse 2s infinite}

.pv-sec{padding:56px 44px}

.pv-stat:last-child{border-right:0}

.pv-splitcard{border:1px solid var(--line);border-radius:3px;padding:28px;background:var(--card)}

.pv-splitcard li{position:relative;padding-left:22px;margin-bottom:8px;font-size:.9rem}
.pv-splitcard li::before{content:"";position:absolute;left:0;top:7px;width:9px;height:9px;background:var(--solar);border-radius:1px}
.pv-testi{padding:56px 44px}
.pv-tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pv-tcard{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:22px;min-width:300px}

.pv-banner{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:40px 0;overflow:hidden}

.pv-cta{background:var(--ink);color:var(--paper);text-align:center;padding:60px 44px;position:relative;overflow:hidden}

.lead-int{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-size:.84rem}
.lead-int.on{border-color:var(--solar);background:rgba(248,188,30,.08)}
.lead-int.on svg{color:var(--amber-2)}
.lead-int.off{opacity:.4}.lead-int.off svg{color:var(--muted-d)}
.lead-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.85rem;margin:6px 0 12px}
.lead-meta div span{font-family:var(--mono);font-size:.58rem;text-transform:uppercase;color:var(--muted);display:block}
/* library + analytics shared */
.adm-wrap{max-width:1180px;margin:0 auto;padding:74px 28px 90px}
.adm-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.adm-h h1{font-family:var(--display);font-weight:900;font-size:2rem}
.adm-h p{color:var(--muted);margin-top:4px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.libcard{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--card);position:relative}
.libcard img{width:100%;height:120px;object-fit:cover;display:block}
.libcard .lc-b{padding:8px 10px}
.libcard .lc-b input{width:100%;border:0;font-size:.74rem;background:none;color:var(--muted)}
.libcard .lc-x{position:absolute;top:4px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:2px;padding:2px 7px;cursor:pointer}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.metric{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:16px}
.metric .n{font-family:var(--display);font-weight:900;font-size:1.7rem;color:var(--ink)}
.metric .k{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;color:var(--muted);margin-top:3px}
.metric .d{font-size:.72rem;margin-top:4px}.metric .up{color:var(--ok)}.metric .dn{color:#b4462f}
.panelcard{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:18px;margin-bottom:16px}
.panelcard h3{font-family:var(--display);font-size:1.05rem;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;font-family:var(--mono);font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.pos{font-family:var(--display);font-weight:800}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars .bar{flex:1;background:var(--solar);border-radius:2px 2px 0 0;position:relative}
.bars .bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:.55rem;color:var(--muted)}
.honest{background:rgba(248,188,30,.12);border:1px solid var(--line);border-left:3px solid var(--solar);border-radius:3px;padding:10px 14px;font-size:.82rem;color:var(--muted);margin-bottom:16px}
.honest b{color:var(--ink)}
</style>
</head>

/* ---- Supabase-backed storage shim: wires the page-builder to /api/cms ---- */
window.storage = {
  async get(key){
    try {
      const r = await fetch('/api/cms?key=' + encodeURIComponent(key), { credentials:'same-origin' });
      if (!r.ok) return null;
      const d = await r.json();
      return (d && d.value != null) ? { value: d.value } : null;
    } catch (e) { return null; }
  },
  async set(key, value){
    const r = await fetch('/api/cms', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({ key, value: String(value) })
    });
    if (!r.ok) throw new Error('save failed');
    return true;
  }
};
window.publishSite = async function(){
  const r = await fetch('/api/cms/publish', { method:'POST', credentials:'same-origin' });
  if (!r.ok) { let m='Publish failed'; try { m=(await r.json()).error||m; } catch(e){} throw new Error(m); }
  return true;
};

function pickImg(path,imgId){const im=(STATE.site.images||[]).find(x=>x.id===imgId);if(im)upd(path,im.data)}
function renderImages(){const el=document.getElementById('panel-images');const imgs=STATE.site.images||[];const cats=[...new Set(imgs.map(im=>im.cat).filter(Boolean))];
 let h='<div class="ph">'+SPARK+'Image library</div><div class="hint">Upload once, reuse anywhere. Images are auto-converted to <b>WebP</b> for faster loading. Tag a category, then filter below.</div>';
 h+='<div class="fld"><label>Upload image(s)</label><input type="file" accept="image/*" multiple id="imgup" onchange="imgUpload(this)"></div>';

 const shown=imgs.map((im,i)=>({im,i})).filter(x=>!IMGFILTER||x.im.cat===IMGFILTER);
 h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+shown.map(({im,i})=>'<div style="border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative"><img src="'+im.data+'" style="width:100%;height:68px;object-fit:cover;display:block"><button class="rm" style="position:absolute;top:2px;right:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:2px;padding:1px 5px" onclick="imgRm('+i+')">×</button><input value="'+esc(im.cat||'')+'" placeholder="category…" style="width:100%;border:0;border-top:1px solid var(--line);font-size:.72rem;padding:5px 7px;background:var(--paper)" onchange="STATE.site.images['+i+'].cat=this.value;renderImages();save()"></div>').join('')+'</div>';
 el.innerHTML=h;}
function toWebp(dataURL,cb){try{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);cb(c.toDataURL('image/webp',0.82));}catch(e){cb(dataURL)}};img.onerror=()=>cb(dataURL);img.src=dataURL;}catch(e){cb(dataURL)}}
function imgUpload(inp){const files=[...inp.files];if(!files.length)return;let done=0;files.forEach(f=>{const r=new FileReader();r.onload=()=>{toWebp(r.result,webp=>{(STATE.site.images=STATE.site.images||[]).push({id:uid(),name:f.name.replace(/\.[^.]+$/,'.webp'),data:webp,cat:''});done++;if(done===files.length){renderImages();save();}});};r.readAsDataURL(f);});}
function imgRm(i){STATE.site.images.splice(i,1);renderImages();save();}

<script>
/* ---- Real Publish: snapshot the draft live via /api/cms/publish ---- */
window.openPublish = function(){
  var box = document.getElementById('modalbox');
  box.innerHTML = '<button class="close" onclick="closeModal()">×</button>'
    + '<h2>Publish to your site</h2>'
    + '<p>This makes your saved changes live on the website. Make sure you\'ve saved first.</p>'
    + '<div id="pubmsg" style="margin:12px 0;font-size:.9rem"></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +   '<button class="tbtn solar" style="color:var(--ink)" onclick="doPublish()">Publish now</button>'
    +   '<button class="tbtn" style="color:var(--ink);border-color:var(--line)" onclick="exportJSON()">Download data (JSON)</button>'
    + '</div>';
  document.getElementById('modal').classList.add('show');
};
window.doPublish = async function(){
  var m = document.getElementById('pubmsg');
  m.style.color = 'var(--muted)'; m.textContent = 'Saving & publishing…';
  try {
    if (typeof save === 'function') { await save(); }
    await window.publishSite();
    m.style.color = 'var(--ok)';
    m.textContent = '✓ Published — your changes are now live.';
  } catch (e) {
    m.style.color = 'var(--amber-2)';
    m.textContent = '⚠ ' + (e && e.message ? e.message : 'Publish failed') + '. Are you signed in as an admin?';
  }
};
</script>
