<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#16222F" />
  <title>Offline · Heliaxis</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f2e7; color: #211f18;
      font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; background: #fffdf8; border: 1px solid rgba(33,31,24,.14); border-radius: 4px; padding: 28px; }
    img { width: 140px; height: auto; }
    h1 { font-size: 1.35rem; margin: 18px 0 6px; }
    p { color: #6e6a5e; line-height: 1.5; margin: 0 0 18px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    a, button { font: inherit; font-size: .9rem; font-weight: 700; padding: .55rem .95rem; border-radius: 2px;
      border: 1px solid rgba(33,31,24,.14); background: #fff; color: #211f18; text-decoration: none; cursor: pointer; }
    .primary { background: #f8bc1e; border-color: #f8bc1e; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/heliaxis-logo.png" alt="Heliaxis" />
    <h1>You're offline</h1>
    <p>This page needs a connection. Your task list still works offline — changes you make there sync
      automatically when you're back online.</p>
    <div class="row">
      <a class="primary" href="/admin/tasks">Open Tasks</a>
      <a href="/admin">Dashboard</a>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
