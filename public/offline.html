<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- Light and dark: follows the choice saved on this device (src/lib/theme), else the phone. -->
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#FFFDF8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#211F18" media="(prefers-color-scheme: dark)" />
  <script>
    (function () {
      try {
        var p = localStorage.getItem('hx-theme');
        if (p === 'light' || p === 'dark') {
          document.documentElement.setAttribute('data-theme', p);
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++) m[i].setAttribute('content', p === 'dark' ? '#211F18' : '#FFFDF8');
        }
      } catch (e) {}
    })();
  </script>
  <title>Offline · Heliaxis</title>
  <style>
    :root { --bg: #f7f2e7; --card: #fffdf8; --text: #211f18; --muted: #6b6659; --line: rgba(33,31,24,.14);
      --btn: #fff; --gold: #f8bc1e; color-scheme: light dark; }
    :root[data-theme=light] { color-scheme: only light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) { --bg: #171510; --card: #211f18; --text: #f7f2e7; --muted: #ada694;
        --line: rgba(247,242,231,.16); --btn: #2c2820; color-scheme: dark; }
    }
    :root[data-theme=dark] { --bg: #171510; --card: #211f18; --text: #f7f2e7; --muted: #ada694;
      --line: rgba(247,242,231,.16); --btn: #2c2820; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 28px; }
    img { width: 140px; height: auto; }
    .logo-light { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) .logo-ink { display: none; }
      :root:not([data-theme=light]) .logo-light { display: block; }
    }
    :root[data-theme=dark] .logo-ink { display: none; }
    :root[data-theme=dark] .logo-light { display: block; }
    h1 { font-size: 1.35rem; margin: 18px 0 6px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 18px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    a, button { font: inherit; font-size: .9rem; font-weight: 700; padding: .55rem .95rem; border-radius: 2px;
      border: 1px solid var(--line); background: var(--btn); color: var(--text); text-decoration: none; cursor: pointer; }
    .primary { background: var(--gold); border-color: var(--gold); color: #211f18; }
  </style>
</head>
<body>
  <main>
    <img class="logo-ink" src="/assets/heliaxis-logo-doc.png" alt="Heliaxis" />
    <img class="logo-light" src="/assets/heliaxis-logo-light.png" alt="Heliaxis" />
    <h1>You're offline</h1>
    <p>This page needs a connection. Your task list still works offline — changes you make there sync
      automatically when you're back online.</p>
    <div class="row">
      <a class="primary" href="/admin/tasks">Open Tasks</a>
      <a href="/admin">Dashboard</a>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
