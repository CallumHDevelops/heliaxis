// Heliaxis staff app: a Trusted Web Activity around https://heliaxis.co.uk/admin.
// The web app does the work (and updates on every deploy); this shell only needs a
// new build for icon/name/permission changes. Release with `node scripts/android-release.mjs`.
plugins {
    id 'com.android.application'
}

def appRelease = new groovy.json.JsonSlurper().parse(file('../release.json'))
def host = 'heliaxis.co.uk'

// Native notifications: the Firebase project's settings for this app, from google-services.json
// (Firebase console → Project settings → Your apps → Android). Read here as plain string
// resources, which is all the Google Services plugin would do for messaging. Without the file
// the app still builds, and notifications fall back to Web Push through Chrome.
def firebase = [:]
def servicesFile = file('google-services.json')
if (servicesFile.exists()) {
    def services = new groovy.json.JsonSlurper().parse(servicesFile)
    def client = services.client.find { it.client_info?.android_client_info?.package_name == 'uk.co.heliaxis.app' }
    if (client) {
        firebase = [
            google_app_id       : client.client_info.mobilesdk_app_id,
            google_api_key      : client.api_key?.getAt(0)?.current_key,
            gcm_defaultSenderId : services.project_info.project_number,
            project_id          : services.project_info.project_id,
            google_storage_bucket: services.project_info.storage_bucket,
        ].findAll { it.value }
    } else {
        logger.warn('google-services.json has no Android app for uk.co.heliaxis.app; building without Firebase.')
    }
}

// Signing key lives outside the repo (see android/README.md).
def keyProps = new Properties()
def keyFile = file(System.getenv('HELIAXIS_KEYSTORE_PROPS') ?: "${System.getProperty('user.home')}/.heliaxis-secrets/android-keystore.properties")
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace 'uk.co.heliaxis.app'
    compileSdk 36

    defaultConfig {
        applicationId 'uk.co.heliaxis.app'
        minSdk 24
        targetSdk 36
        versionCode appRelease.versionCode
        versionName appRelease.versionName

        buildConfigField 'String', 'SITE_ORIGIN', "\"https://${host}\""
        firebase.each { name, value -> resValue 'string', name, value.toString() }

        // The web app reads ?app=android-<versionCode> to know which build is installed.
        manifestPlaceholders = [
            hostName : host,
            launchUrl: "https://${host}/admin?app=android-${appRelease.versionCode}",
        ]
    }

    signingConfigs {
        release {
            if (keyProps['storeFile']) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyProps['storeFile'] ? signingConfigs.release : null
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
    implementation 'com.google.firebase:firebase-messaging:26.0.0'
    implementation 'androidx.core:core:1.13.1'
}
